name: Release checksums

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose archives need checksums.
        required: true
        type: string

concurrency:
  group: release-checksums-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Publish archive checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          directory="$(mktemp -d)"
          expected_archives=(
            "rorksign-macos-universal.zip"
            "rorksign-windows-x64.zip"
          )
          ready=false
          for attempt in {1..40}; do
            rm -f "$directory"/*.zip
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "${expected_archives[0]}" \
              --pattern "${expected_archives[1]}" \
              --dir "$directory" || true
            if test -f "$directory/${expected_archives[0]}" &&
              test -f "$directory/${expected_archives[1]}"; then
              ready=true
              break
            fi
            sleep 15
          done
          if [ "$ready" != true ]; then
            echo "Both platform archives were not available before the timeout." >&2
            exit 1
          fi

          rm -f "$directory"/*.zip
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.zip" \
            --dir "$directory"
          (
            cd "$directory"
            for archive in *.zip; do
              sha256sum "$archive"
            done
          ) > "$directory/checksums.txt"

          release_endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          existing_id="$(
            gh api "$release_endpoint" \
              --jq '.assets[] | select(.name == "checksums.txt") | .id'
          )"
          if [ -n "$existing_id" ]; then
            existing_directory="$(mktemp -d)"
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "checksums.txt" \
              --dir "$existing_directory"
            if ! cmp -s \
              "$directory/checksums.txt" \
              "$existing_directory/checksums.txt"; then
              echo "The existing checksum manifest differs from the release archives." >&2
              exit 1
            fi
            exit 0
          fi

          gh release upload "$RELEASE_TAG" "$directory/checksums.txt" \
            --repo "$GITHUB_REPOSITORY"
          verification_directory="$(mktemp -d)"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "checksums.txt" \
            --dir "$verification_directory"
          cmp -s \
            "$directory/checksums.txt" \
            "$verification_directory/checksums.txt"
