name: Release checksums

on:
  workflow_run:
    workflows:
      - Windows x64
      - macOS universal
    types:
      - completed

concurrency:
  group: release-checksums-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-slim
    steps:
      - name: Publish archive checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi

          directory="$(mktemp -d)"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.zip" \
            --dir "$directory"
          (
            cd "$directory"
            for archive in *.zip; do
              sha256sum "$archive"
            done
          ) > "$directory/SHA256SUMS.txt"
          gh release upload "$RELEASE_TAG" "$directory/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
